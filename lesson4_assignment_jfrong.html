<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shanghai Weather Today</title>
  <style>
    :root {
      --sun-color: #ff9f1c;
      --sun-deep: #ff7b00;
      --butter: #ffd93d;
      --soft-yellow: #fff2b3;
      --cream: #fffaf0;
      --ink: #3a2a13;
      --shadow: rgba(255, 153, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--soft-yellow), var(--cream));
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
    }

    .weather-card {
      width: 420px;
      background: linear-gradient(180deg, #fff7d6, #ffe7a8);
      border: 3px solid var(--sun-color);
      border-radius: 24px;
      box-shadow: 0 12px 28px var(--shadow);
      padding: 30px 24px;
      text-align: center;
    }

    .city {
      font-size: 2rem;
      font-weight: bold;
      color: var(--sun-deep);
      margin-bottom: 12px;
    }

    .temp {
      font-size: 3rem;
      font-weight: bold;
      color: var(--sun-deep);
      margin: 10px 0;
    }

    .condition {
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid var(--butter);
      border-radius: 14px;
      padding: 14px 10px;
    }

    .label {
      font-size: 0.8rem;
      color: var(--sun-deep);
      font-weight: bold;
      margin-bottom: 5px;
    }

    .value {
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="weather-card">
    <div class="city">Shanghai</div>
    <div class="temp">28°C</div>
    <div class="condition">Sunny & Bright</div>

    <div class="info">
      <div class="info-box">
        <div class="label">Humidity</div>
        <div class="value">58%</div>
      </div>

      <div class="info-box">
        <div class="label">Wind</div>
        <div class="value">NE 10 km/h</div>
      </div>

      <div class="info-box">
        <div class="label">UV Index</div>
        <div class="value">6</div>
      </div>

      <div class="info-box">
        <div class="label">Feels Like</div>
        <div class="value">30°C</div>
      </div>
    </div>
  </div>
</body>
</html>
