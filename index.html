<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Currency Converter</title>
    </head>

    <style>
        h1{
            text-align:left;
            color:rgb(255, 207, 75);
        }

        <p class="result">{
            text-align:left;
            color:rgb(255, 207, 75);
        }
    </style>

    <body>
        <h1>Currency Converter</h1>
        <label for="amount">Amount:</label>
        <input type="number"id="amount" placeholder="Enter amount"><br><br>


        <label for="fromCurrency">From:</label>
        <select id="fromCurrency">
            <option value="CNY">CNY</option>
            <option value="EUR">EUR</option>
        </select>
        <br><br>

        <label for="toCurrency">To:</label>
        <select id="toCurrency">
            <option value="EUR">EUR</option>
            <option value="CNY">CNY</option>
        </select>
        <br><br>

        <button id="convertButton">Convert</button><br><br>

        <h2 id="result">Result is here</h2>

        <script src="CS7025-Programming for Digital Media-lesson3.js"></script>

    </body>
</html>
